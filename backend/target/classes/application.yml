server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/homestay-management?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: homestay-management-jwt-secret-key-2024-must-be-at-least-256-bits-long
  expiration: 86400000
